server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Eigene 404-Seite (mit "noindex"), statt der nackten nginx-Fehlerseite
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Für Suchmaschinen: richtige Dateitypen, kurz gecacht, damit Änderungen schnell ankommen
    location = /robots.txt  { default_type text/plain; expires 1h; add_header Cache-Control "public"; }
    location = /sitemap.xml { default_type application/xml; expires 1h; add_header Cache-Control "public"; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Die Schnittstelle der Bewertungen gehört nicht in die Suche
    location /api/ {
        proxy_pass http://aurachat-website-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Statische Dateien (Bilder, CSS) länger cachen - reine Werbeseite, ändert sich selten
    location ~* \.(png|jpe?g|svg|css|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Kleinere Übertragung (zählt für die Ladezeit, die Google mitbewertet)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/html text/plain text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
}
