services:
  auraticket:
    build: .
    container_name: auraticket
    restart: unless-stopped
    ports:
      - "3400:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # AuraControl auf diesem Rechner (Lizenz abholen)
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - LICENSE_SECRET=${LICENSE_SECRET}
      - LICENSE_SYNC_URL=${LICENSE_SYNC_URL:-}   # Suite-Lizenz automatisch von AuraControl holen. Leer = host.docker.internal:8000; '-' schaltet ab
      - AURA_SUITE_VERSION=${AURA_SUITE_VERSION:-}   # optional: Version der Aura-Suite, erscheint unter "Über Aura-Suite"
    volumes:
      - ./data:/app/data
