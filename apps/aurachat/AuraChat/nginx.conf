server {
    listen 80;
    server_name localhost;

    # Die Anwendung (Anmeldung, Chat, Schnittstelle) soll nicht in der Google-Suche auftauchen
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Leitet /api/ intern an das Backend weiter, sodass Frontend + Backend
    # für den Browser wie EINE Origin aussehen (kein CORS nötig, Cookies
    # funktionieren ohne Cross-Site-Sonderfälle - wichtig für Sessions).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reicht das ORIGINALE Protokoll (http/https) durch, falls schon von Caddy gesetzt
        # (TLS-Terminierung passiert bei Caddy, nginx spricht intern nur http mit Caddy).
        # Ohne Caddy davor (z.B. lokaler Zugriff über :8080) ist der Header leer -> http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # KI-Antworten (besonders Code-Fragen und das erste Laden eines Modells) dauern oft länger
        # als nginx' Standard von 60 Sekunden. Danach schickte nginx eine HTML-Fehlerseite
        # ("504 Gateway Time-out"), die der Browser nicht lesen konnte. Deshalb hier grosszügig.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        send_timeout 900s;
    }

    # Chat-Anfragen mit Foto oder Datei: ein Handyfoto ist als Base64 oft 3 bis 8 MB gross. nginx erlaubt ohne Angabe nur 1 MB und lehnt grössere mit
    # "413" ab (im Browser dann als "Unexpected token <" sichtbar). Deshalb für GENAU diese Adresse 16 MB; alle anderen Adressen bleiben bei 1 MB
    # (so kann jemand ohne Anmeldung, z.B. Gast oder Anmeldeseite, den Server nicht mit riesigen Anfragen belasten).
    location = /api/chat/generate {
        client_max_body_size 16m;
        proxy_pass http://backend:3000/api/chat/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        send_timeout 900s;
    }

    # JS/CSS NICHT cachen (Projekt ist in sehr aktiver Entwicklung - jeder Cache,
    # und sei er noch so kurz, hat schon zu Verwirrung geführt, ob ein Update wirklich
    # angekommen ist. Sobald der Entwicklungsstand stabiler ist, kann hier wieder ein
    # kurzer Cache-Wert rein.)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Bilder/Icons dürfen ruhig länger gecacht werden, ändern sich selten
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Korrekter MIME-Type fürs PWA-Manifest (Kiosk-Ansicht "nur Aura", siehe kiosk.html)
    location ~* \.webmanifest$ {
        add_header Content-Type "application/manifest+json";
    }
}
