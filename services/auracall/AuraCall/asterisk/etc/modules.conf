; AuraCall - Module. Alles Nötige wird geladen (autoload); gesperrt wird, was ein Telefonie-Server für Aura NICHT braucht.
; Besonders wichtig: Module, mit denen sich über den Dialplan Befehle ausführen oder fremde Programme starten lassen, sind ABGESCHALTET.
; Selbst wenn je eine Zeile unerwünscht in die Konfiguration gelänge, könnte Asterisk keine Systembefehle ausführen.
[modules]
autoload = yes
noload = app_system.so
noload = func_shell.so
noload = app_externalivr.so
noload = app_agi.so
noload = res_agi.so
noload = app_fax.so
noload = app_mixmonitor.so
noload = app_chanspy.so
noload = app_dial.so
noload = app_queue.so
noload = app_voicemail.so
noload = app_confbridge.so
noload = app_meetme.so
noload = pbx_ael.so
noload = pbx_lua.so
noload = pbx_realtime.so
noload = pbx_spool.so
noload = chan_sip.so
noload = chan_iax2.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = chan_mgcp.so
noload = chan_alsa.so
noload = chan_oss.so
noload = chan_console.so
noload = chan_dahdi.so
; (ARI/Stasis bleiben geladen, sonst melden die davon abhängigen Module Fehler beim Start; der Webserver ist in http.conf ausgeschaltet, ARI ist also nicht erreichbar)
