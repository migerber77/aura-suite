; AuraCall - Steuerung von Asterisk durch das Programm AuraCall (AMI). Nur von diesem Rechner aus erreichbar.
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no
authtimeout = 5
authlimit = 3

[auracall]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; lesen: Ereignisse von Anrufen und Benutzer-Ereignisse; schreiben: Anrufe auslösen und neu laden (kein "command": keine Befehle der Konsole)
read = system,call,reporting,user
write = system,call,originate
