; AuraCall - SIP-Grundeinstellungen. Die Leitung des Anbieters kommt aus der Verwaltung von AuraCall (Datei auracall/pjsip_auracall.conf).
[global]
type = global
user_agent = AuraCall
; Anrufer werden NUR über ihre Absender-Adresse einem Eintrag zugeordnet (identify: Server des Anbieters). Wer nicht dazugehört, bekommt keinen
; Eintrag und wird von Asterisk abgewiesen - kein "anonymer" Zutritt.
endpoint_identifier_order = ip

[system]
type = system
timer_t1 = 500
timer_b = 32000

; Hilfs-Transporte, NUR auf dem eigenen Rechner (127.0.0.1) und auf anderen Ports als die echte Leitung (5060).
; Warum: Asterisk prüft beim START, welche SIP-Übertragungsarten es gibt. Ist dann kein Transport da (die Leitung wird ja erst später in der Verwaltung
; eingerichtet), schaltet es die Namensauflösung dafür AB, und ein späteres "Neu laden" holt das nicht nach: die Anmeldung beim Anbieter sendet dann nie ein Paket
; (Meldung "No response received", "UDP+IPv4 is not an available SIP transport"). Mit diesen beiden Hilfs-Transporten gelten UDP und TCP von Anfang an als vorhanden.
[auracall-boot-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5069

[auracall-boot-tcp]
type = transport
protocol = tcp
bind = 127.0.0.1:5069

#tryinclude "auracall/pjsip_auracall.conf"
#tryinclude "pjsip_custom.conf"
