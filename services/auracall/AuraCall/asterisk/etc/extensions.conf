; AuraCall - Dialplan-Grundeinstellungen. Eingehende und ausgehende Anrufe stehen in auracall/extensions_auracall.conf (aus der Verwaltung erzeugt).
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]

; Alles, was nicht ausdrücklich vorgesehen ist, wird abgewiesen
[default]
exten => _.,1,Hangup(21)

#tryinclude "auracall/extensions_auracall.conf"
#tryinclude "extensions_custom.conf"
