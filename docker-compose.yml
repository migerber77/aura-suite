services:
  chat:
    image: migerber77/aura-suite:chat
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      - TZ=Europe/Zurich

  plan:
    image: migerber77/aura-suite:plan
    restart: unless-stopped
    ports:
      - "3002:3000"

  ticket:
    image: migerber77/aura-suite:ticket
    restart: unless-stopped
    ports:
      - "3400:3000"

  mail:
    image: migerber77/aura-suite:mail
    restart: unless-stopped
    ports:
      - "2525:2525"
      - "3300:3000"

  direct:
    image: migerber77/aura-suite:direct
    restart: unless-stopped
    ports:
      - "389:389"
      - "4000:4000"

  proxy:
    image: migerber77/aura-suite:proxy
    restart: unless-stopped
    ports:
      - "3500:3000"

  call:
    image: migerber77/aura-suite:call
    restart: unless-stopped
